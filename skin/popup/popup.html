<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="star">✦</span>
      <div>
        <h1>Wild West</h1>
        <p class="tag">Dust Settings</p>
      </div>
      <label class="power" title="Dust on / off">
        <input type="checkbox" id="enabled" />
        <span class="knob"></span>
      </label>
    </header>

    <section class="controls">
      <div class="ctl">
        <label for="intensity">How dusty <span id="intensityVal">100%</span></label>
        <input type="range" id="intensity" min="0" max="1.5" step="0.1" value="1" />
      </div>
      <label class="check">
        <input type="checkbox" id="grain" />
        <span>Sprinkle paper grain</span>
      </label>
    </section>

    <footer>Rides along on every page you open.</footer>
    <script src="popup.js"></script>
  </body>
</html>
